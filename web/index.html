<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>勾选下载</title>
<style>
:root {
  --bg: #f6f6f4;
  --panel: #ffffff;
  --text: #1d1d1b;
  --muted: #74746f;
  --line: #e4e4df;
  --hover: #f0f0ec;
  --accent: #2f6fde;
  --accent-soft: #e6eefc;
  --ok: #2c8a4b;
  --ok-soft: #e3f3e8;
  --warn: #b26a00;
  --warn-soft: #fbf0dc;
  --bad: #c43c3c;
  --bad-soft: #fbe5e5;
  --cursor: #f2b632;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161615;
    --panel: #1f1f1d;
    --text: #ebebe6;
    --muted: #9a9a93;
    --line: #33332f;
    --hover: #2a2a27;
    --accent: #6b9bf0;
    --accent-soft: #1f2d48;
    --ok: #5cc27e;
    --ok-soft: #1c3324;
    --warn: #e0a54a;
    --warn-soft: #3a2c15;
    --bad: #ec7b7b;
    --bad-soft: #3d1f1f;
    --cursor: #d9a32a;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  display: grid;
  grid-template-columns: 280px 1fr;
  grid-template-rows: 1fr auto;
  grid-template-areas: "side main" "foot foot";
}
button {
  font: inherit;
  color: var(--text);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 5px 10px;
  cursor: pointer;
  white-space: nowrap;
}
button:hover { background: var(--hover); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.primary:hover { filter: brightness(1.08); }
button:disabled { opacity: .45; cursor: default; }
button.toggle[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
input[type="text"] {
  font: inherit;
  color: var(--text);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 5px 9px;
  min-width: 0;
}
input[type="text"]:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
input.invalid { border-color: var(--bad); }

/* 侧栏：JSON文件列表 */
#side {
  grid-area: side;
  border-right: 1px solid var(--line);
  background: var(--panel);
  overflow-y: auto;
  min-height: 0;
}
#side h1 { font-size: 15px; margin: 0; padding: 14px 14px 10px; }
#files { list-style: none; margin: 0; padding: 0 8px 12px; }
#files li {
  padding: 8px 10px;
  border-radius: 6px;
  cursor: pointer;
  margin-bottom: 2px;
}
#files li:hover { background: var(--hover); }
#files li.active { background: var(--accent-soft); }
#files .f-label { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#files .f-meta { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kind { font-size: 11px; padding: 0 5px; border-radius: 4px; margin-right: 4px; background: var(--hover); color: var(--muted); }

/* 主区域 */
#main { grid-area: main; display: flex; flex-direction: column; min-height: 0; min-width: 0; }
#toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
  padding: 10px 14px;
  border-bottom: 1px solid var(--line);
  background: var(--panel);
}
#toolbar .group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
#filter { flex: 1 1 220px; }
#chapter { width: 110px; }
#toolbar .sep { width: 1px; height: 22px; background: var(--line); margin: 0 2px; }
#hint { color: var(--muted); font-size: 12px; padding: 4px 14px; border-bottom: 1px solid var(--line); }
#hint kbd {
  font: 11px ui-monospace, SFMono-Regular, Menlo, monospace;
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 0 4px;
  background: var(--panel);
}

#list { flex: 1; overflow-y: auto; min-height: 0; user-select: none; -webkit-user-select: none; }
#empty { color: var(--muted); padding: 40px 14px; text-align: center; }
.row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 14px;
  border-bottom: 1px solid var(--line);
  cursor: pointer;
  border-left: 3px solid transparent;
}
.row:hover { background: var(--hover); }
.row.sel { background: var(--accent-soft); }
.row.cursor { border-left-color: var(--cursor); }
.row.dl .title { color: var(--muted); }
.cb {
  flex: none;
  width: 18px;
  height: 18px;
  border: 1.5px solid var(--muted);
  border-radius: 4px;
  display: grid;
  place-items: center;
}
.row.sel .cb { background: var(--accent); border-color: var(--accent); }
.row.sel .cb::after {
  content: "";
  width: 9px;
  height: 5px;
  border: solid #fff;
  border-width: 0 0 2px 2px;
  transform: translateY(-1px) rotate(-45deg);
}
.cover {
  flex: none;
  width: 48px;
  height: 66px;
  object-fit: cover;
  border-radius: 4px;
  background: var(--hover);
}
.cover.broken { visibility: hidden; }
#list.nocover .cover { display: none; }
.main-col { flex: 1; min-width: 0; }
.title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.meta { color: var(--muted); font-size: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
.badges { flex: none; display: flex; gap: 4px; }
.badge { font-size: 12px; padding: 1px 7px; border-radius: 10px; white-space: nowrap; }
.b-dl { background: var(--ok-soft); color: var(--ok); }
.b-chapter { background: var(--hover); color: var(--text); padding: 0 6px; border-radius: 4px; }
.s-pending, .s-cancelled { background: var(--hover); color: var(--muted); }
.s-downloading { background: var(--warn-soft); color: var(--warn); }
.s-done, .s-skipped { background: var(--ok-soft); color: var(--ok); }
.s-failed { background: var(--bad-soft); color: var(--bad); }

/* 底栏 */
#foot {
  grid-area: foot;
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
  padding: 10px 14px;
  border-top: 1px solid var(--line);
  background: var(--panel);
}
#counts { font-variant-numeric: tabular-nums; }
#counts b { font-size: 16px; }
#counts .hidden-note { color: var(--warn); }
#job { flex: 1; min-width: 200px; color: var(--muted); font-size: 13px; }
#job .bar { height: 4px; background: var(--hover); border-radius: 2px; margin-top: 4px; overflow: hidden; }
#job .bar > div { height: 100%; background: var(--accent); transition: width .3s; }
#foot .actions { display: flex; gap: 6px; flex-wrap: wrap; }
#toast {
  position: fixed;
  left: 50%;
  bottom: 70px;
  transform: translateX(-50%);
  background: var(--text);
  color: var(--bg);
  padding: 8px 14px;
  border-radius: 6px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s;
  max-width: calc(100% - 32px);
}
#toast.show { opacity: 1; }

@media (max-width: 760px) {
  body {
    grid-template-columns: 1fr;
    grid-template-rows: auto 1fr auto;
    grid-template-areas: "side" "main" "foot";
  }
  #side { max-height: 30vh; border-right: 0; border-bottom: 1px solid var(--line); }
  #hint { display: none; }
  .row { padding: 6px 10px; }
}
</style>
</head>
<body>
<aside id="side">
  <h1>导出的 JSON</h1>
  <ul id="files"></ul>
</aside>

<main id="main">
  <div id="toolbar">
    <input id="filter" type="text" placeholder="筛选：空格分隔都要包含，-开头排除，如  學姊 -漢化" autocomplete="off">
    <input id="chapter" type="text" placeholder="话数 100-128" autocomplete="off">
    <span class="sep"></span>
    <div class="group">
      <button data-bulk="all" title="快捷键 a">全选</button>
      <button data-bulk="none">全不选</button>
      <button data-bulk="invert" title="快捷键 i">反选</button>
      <button data-bulk="undownloaded" title="快捷键 u">只选未下载</button>
    </div>
    <span class="sep"></span>
    <div class="group">
      <button id="hideDl" class="toggle" aria-pressed="false">隐藏已下载</button>
      <button id="coverToggle" class="toggle" aria-pressed="true">封面</button>
    </div>
  </div>
  <div id="hint">
    点行切换 · 按住拖动连续切换 · <kbd>Shift</kbd>+点击选一段 ·
    <kbd>j</kbd>/<kbd>k</kbd> 移动 <kbd>空格</kbd> 切换 <kbd>a</kbd> 全选 <kbd>i</kbd> 反选 <kbd>u</kbd> 只选未下载 <kbd>/</kbd> 筛选 ·
    批量按钮只作用于当前显示的行
  </div>
  <div id="list"><div id="empty">从左侧选择一个 JSON 文件</div></div>
</main>

<footer id="foot">
  <div id="counts"></div>
  <div id="job"></div>
  <div class="actions">
    <button id="selectFailed" hidden>勾选失败项</button>
    <button id="stopBtn" hidden>停止</button>
    <button id="exportBtn" disabled>导出选中为 JSON</button>
    <button id="downloadBtn" class="primary" disabled>下载选中</button>
  </div>
</footer>
<div id="toast"></div>

<script>
const $ = (sel) => document.querySelector(sel);
const listEl = $('#list');

const STATUS_LABEL = {
  pending: '等待', downloading: '下载中', done: '完成',
  skipped: '已存在', failed: '失败', cancelled: '未下载',
};

const state = {
  files: [],
  file: null,        // 当前文件名
  label: '',
  comics: [],        // 当前文件的漫画
  byId: new Map(),
  selected: new Set(),
  visible: [],       // 当前显示的漫画ID（按文件顺序）
  cursor: -1,        // visible中的下标
  anchorId: null,    // Shift范围选择的起点
  drag: null,        // { state, lastIdx }
  hideDownloaded: false,
  showCover: true,
  job: null,
  jobStatus: new Map(),
};

function storageGet(key) {
  try { return localStorage.getItem(key); } catch { return null; }
}
function storageSet(key, value) {
  try { localStorage.setItem(key, value); } catch { /* 隐私模式等情况下忽略 */ }
}

function escapeHtml(text) {
  return String(text).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  })[c]);
}

function normalize(text) {
  return String(text).normalize('NFKC').toLowerCase();
}

let toastTimer = null;
function toast(message) {
  const el = $('#toast');
  el.textContent = message;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

async function api(path, options = {}) {
  const resp = await fetch(path, {
    headers: { 'Content-Type': 'application/json' },
    ...options,
  });
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok) throw new Error(data.detail || `请求失败 (${resp.status})`);
  return data;
}

/* ---------- 文件列表 ---------- */

async function loadFiles() {
  state.files = await api('/api/files');
  renderFiles();
}

function renderFiles() {
  const kindName = { shelf: '书架', search: '搜索', selected: '勾选' };
  $('#files').innerHTML = state.files.map((f) => `
    <li data-name="${escapeHtml(f.name)}" class="${f.name === state.file ? 'active' : ''}" title="${escapeHtml(f.name)}">
      <div class="f-label"><span class="kind">${kindName[f.kind] || f.kind}</span>${escapeHtml(f.label.replace(/^.+?：/, '') || f.name)}</div>
      <div class="f-meta">${f.count} 部 · ${escapeHtml(f.name)}</div>
    </li>`).join('') || '<li class="f-meta">search_results/ 里没有 JSON 文件</li>';
}

$('#files').addEventListener('click', (e) => {
  const li = e.target.closest('li[data-name]');
  if (li) openFile(li.dataset.name);
});

async function openFile(name) {
  let data;
  try {
    data = await api(`/api/files/${encodeURIComponent(name)}`);
  } catch (err) {
    toast(err.message);
    return;
  }
  state.file = name;
  state.label = data.label;
  state.comics = data.comics;
  state.byId = new Map(data.comics.map((c) => [c.id, c]));
  state.selected = new Set();
  state.cursor = -1;
  state.anchorId = null;
  storageSet('wn.file', name);
  document.title = `勾选下载 · ${data.label || name}`;
  renderFiles();
  applyFilter();
}

/* ---------- 筛选与渲染 ---------- */

function parseChapterRange() {
  const input = $('#chapter');
  const text = input.value.trim();
  input.classList.remove('invalid');
  if (!text) return null;
  const m = text.match(/^(\d+)\s*(?:[-~～]\s*(\d+))?$/);
  if (!m) {
    input.classList.add('invalid');
    return null;
  }
  const lo = Number(m[1]);
  const hi = m[2] ? Number(m[2]) : lo;
  return [Math.min(lo, hi), Math.max(lo, hi)];
}

function applyFilter() {
  const tokens = normalize($('#filter').value).split(/\s+/).filter(Boolean);
  const include = tokens.filter((t) => !t.startsWith('-'));
  const exclude = tokens.filter((t) => t.startsWith('-') && t.length > 1).map((t) => t.slice(1));
  const range = parseChapterRange();

  state.visible = state.comics.filter((c) => {
    if (state.hideDownloaded && c.downloaded) return false;
    if (range) {
      if (c.chapter_start == null || c.chapter_end < range[0] || c.chapter_start > range[1]) return false;
    }
    if (include.length || exclude.length) {
      const hay = normalize(`${c.title} ${c.id} ${c.info}`);
      if (!include.every((t) => hay.includes(t))) return false;
      if (exclude.some((t) => hay.includes(t))) return false;
    }
    return true;
  }).map((c) => c.id);

  if (state.cursor >= state.visible.length) state.cursor = state.visible.length - 1;
  renderList();
}

function rowHtml(c, idx) {
  const classes = ['row'];
  if (state.selected.has(c.id)) classes.push('sel');
  if (c.downloaded) classes.push('dl');
  if (idx === state.cursor) classes.push('cursor');
  const chapter = c.chapter_start == null ? ''
    : `<span class="b-chapter">${c.chapter_start === c.chapter_end ? c.chapter_start : `${c.chapter_start}-${c.chapter_end}`} 话</span>`;
  const cover = state.showCover && c.cover
    ? `<img class="cover" loading="lazy" alt="" src="/api/cover?url=${encodeURIComponent(c.cover)}">`
    : '';
  return `
    <div class="${classes.join(' ')}" data-id="${c.id}" role="checkbox" aria-checked="${state.selected.has(c.id)}">
      <span class="cb"></span>
      ${cover}
      <div class="main-col">
        <div class="title" title="${escapeHtml(c.title)}">${escapeHtml(c.title)}</div>
        <div class="meta"><span>#${c.id}</span>${chapter}<span>${escapeHtml(c.info)}</span></div>
      </div>
      <div class="badges">${badgesHtml(c)}</div>
    </div>`;
}

function badgesHtml(c) {
  let html = c.downloaded ? '<span class="badge b-dl">已下载</span>' : '';
  const status = state.job && state.job.file === state.file ? state.jobStatus.get(c.id) : null;
  if (status) html += `<span class="badge s-${status}">${STATUS_LABEL[status] || status}</span>`;
  return html;
}

function renderList() {
  listEl.classList.toggle('nocover', !state.showCover);
  if (!state.file) {
    listEl.innerHTML = '<div id="empty">从左侧选择一个 JSON 文件</div>';
  } else if (!state.visible.length) {
    listEl.innerHTML = '<div id="empty">没有符合筛选条件的漫画</div>';
  } else {
    listEl.innerHTML = state.visible.map((id, idx) => rowHtml(state.byId.get(id), idx)).join('');
  }
  updateFooter();
}

function rowEl(id) {
  return listEl.querySelector(`.row[data-id="${id}"]`);
}

/* ---------- 勾选 ---------- */

function setSelected(id, on) {
  if (on) state.selected.add(id); else state.selected.delete(id);
  const el = rowEl(id);
  if (el) {
    el.classList.toggle('sel', on);
    el.setAttribute('aria-checked', String(on));
  }
}

function setRange(fromIdx, toIdx, on) {
  const [a, b] = fromIdx < toIdx ? [fromIdx, toIdx] : [toIdx, fromIdx];
  for (let i = a; i <= b; i++) setSelected(state.visible[i], on);
}

function changed() {
  updateFooter();
}

function setCursor(idx, scroll = true) {
  const prev = state.visible[state.cursor];
  if (prev != null) rowEl(prev)?.classList.remove('cursor');
  state.cursor = idx;
  const el = rowEl(state.visible[idx]);
  if (el) {
    el.classList.add('cursor');
    if (scroll) el.scrollIntoView({ block: 'nearest' });
  }
}

listEl.addEventListener('mousedown', (e) => {
  if (e.button !== 0) return;
  const row = e.target.closest('.row');
  if (!row) return;
  e.preventDefault();
  if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur();

  const id = Number(row.dataset.id);
  const idx = state.visible.indexOf(id);
  const anchorIdx = state.anchorId == null ? -1 : state.visible.indexOf(state.anchorId);

  if (e.shiftKey && anchorIdx >= 0) {
    setRange(anchorIdx, idx, state.selected.has(state.anchorId));
  } else {
    const on = !state.selected.has(id);
    setSelected(id, on);
    state.anchorId = id;
    state.drag = { on, lastIdx: idx };
  }
  setCursor(idx, false);
  changed();
});

listEl.addEventListener('mouseover', (e) => {
  if (!state.drag) return;
  const row = e.target.closest('.row');
  if (!row) return;
  const idx = state.visible.indexOf(Number(row.dataset.id));
  if (idx < 0 || idx === state.drag.lastIdx) return;
  // 鼠标移动过快会跳过中间行，按区间补齐
  setRange(state.drag.lastIdx, idx, state.drag.on);
  state.drag.lastIdx = idx;
  setCursor(idx, false);
  changed();
});

window.addEventListener('mouseup', () => { state.drag = null; });

listEl.addEventListener('error', (e) => {
  if (e.target.tagName === 'IMG') e.target.classList.add('broken');
}, true);

function bulk(kind) {
  for (const id of state.visible) {
    const c = state.byId.get(id);
    if (kind === 'all') setSelected(id, true);
    else if (kind === 'none') setSelected(id, false);
    else if (kind === 'invert') setSelected(id, !state.selected.has(id));
    else if (kind === 'undownloaded') setSelected(id, !c.downloaded);
  }
  changed();
}

document.querySelectorAll('[data-bulk]').forEach((btn) => {
  btn.addEventListener('click', () => bulk(btn.dataset.bulk));
});

document.addEventListener('keydown', (e) => {
  const tag = e.target.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA') {
    if (e.key === 'Escape' || e.key === 'Enter') e.target.blur();
    return;
  }
  if (e.metaKey || e.ctrlKey || e.altKey || !state.file) return;

  const n = state.visible.length;
  switch (e.key) {
    case 'j':
    case 'ArrowDown':
      if (n) setCursor(Math.min(n - 1, state.cursor + 1));
      break;
    case 'k':
    case 'ArrowUp':
      if (n) setCursor(Math.max(0, state.cursor - 1));
      break;
    case ' ':
    case 'x':
      if (state.cursor >= 0) {
        const id = state.visible[state.cursor];
        setSelected(id, !state.selected.has(id));
        state.anchorId = id;
        changed();
      }
      break;
    case 'a': bulk('all'); break;
    case 'i': bulk('invert'); break;
    case 'u': bulk('undownloaded'); break;
    case '/': $('#filter').focus(); break;
    default: return;
  }
  e.preventDefault();
});

function selectedIdsInOrder() {
  return state.comics.filter((c) => state.selected.has(c.id)).map((c) => c.id);
}

/* ---------- 底栏 ---------- */

function updateFooter() {
  const total = state.comics.length;
  const sel = state.selected.size;
  const visibleSet = new Set(state.visible);
  let hiddenSel = 0;
  for (const id of state.selected) if (!visibleSet.has(id)) hiddenSel++;
  const downloaded = state.comics.filter((c) => c.downloaded).length;

  $('#counts').innerHTML = state.file
    ? `已选 <b>${sel}</b> / ${total} · 显示 ${state.visible.length} · 已下载 ${downloaded}`
      + (hiddenSel ? ` <span class="hidden-note">（${hiddenSel} 项已选但被筛选隐藏）</span>` : '')
    : '';

  const running = !!(state.job && state.job.running);
  $('#downloadBtn').textContent = `下载选中 (${sel})`;
  $('#downloadBtn').disabled = !sel || running;
  $('#exportBtn').disabled = !sel;
  $('#stopBtn').hidden = !running;
  $('#stopBtn').disabled = !!(state.job && state.job.stop_requested);
}

/* ---------- 导出 / 下载 ---------- */

$('#exportBtn').addEventListener('click', async () => {
  try {
    const res = await api(`/api/files/${encodeURIComponent(state.file)}/export`, {
      method: 'POST', body: JSON.stringify({ ids: selectedIdsInOrder() }),
    });
    toast(`已导出 ${res.count} 部到 ${res.name}`);
    await loadFiles();
  } catch (err) {
    toast(err.message);
  }
});

$('#downloadBtn').addEventListener('click', async () => {
  const ids = selectedIdsInOrder();
  if (!ids.length) return;
  const hidden = ids.filter((id) => !state.visible.includes(id)).length;
  const note = hidden ? `\n其中 ${hidden} 部被筛选隐藏，也会一起下载。` : '';
  if (!confirm(`开始下载 ${ids.length} 部？下载时会打开浏览器窗口。${note}`)) return;
  try {
    setJob(await api('/api/download', { method: 'POST', body: JSON.stringify({ file: state.file, ids }) }));
    pollJob();
  } catch (err) {
    toast(err.message);
  }
});

$('#stopBtn').addEventListener('click', async () => {
  try { setJob(await api('/api/download/stop', { method: 'POST' })); } catch (err) { toast(err.message); }
});

$('#selectFailed').addEventListener('click', () => {
  if (!state.job || state.job.file !== state.file) return;
  const failed = new Set(state.job.items.filter((i) => i.status === 'failed').map((i) => i.id));
  for (const c of state.comics) setSelected(c.id, failed.has(c.id));
  changed();
  toast(`已勾选 ${failed.size} 个失败项`);
});

function setJob(job) {
  const wasRunning = !!(state.job && state.job.running);
  state.job = job;
  state.jobStatus = new Map(job.items.map((i) => [i.id, i.status]));

  // 只更新状态徽标，不重绘整个列表
  if (job.file === state.file) {
    for (const id of state.visible) {
      const el = rowEl(id);
      if (el) el.querySelector('.badges').innerHTML = badgesHtml(state.byId.get(id));
    }
  }

  const total = job.items.length;
  const c = job.counts || {};
  const finished = (c.done || 0) + (c.skipped || 0) + (c.failed || 0);
  const jobEl = $('#job');
  if (!total) {
    jobEl.innerHTML = '';
  } else {
    const current = job.items.find((i) => i.status === 'downloading');
    jobEl.innerHTML = `
      <div>${job.running ? '下载中' : '上次下载'} ${finished}/${total} · 成功 ${(c.done || 0) + (c.skipped || 0)} · 失败 ${c.failed || 0}
        ${current ? ` · 当前 #${current.id}` : ''} — ${escapeHtml(job.message || '')}</div>
      <div class="bar"><div style="width:${total ? (finished / total * 100) : 0}%"></div></div>`;
  }
  $('#selectFailed').hidden = job.running || !c.failed || job.file !== state.file;
  updateFooter();

  if (wasRunning && !job.running) {
    toast(job.message || '下载结束');
    if (state.file) refreshDownloadedFlags();
    loadFiles();
  }
}

async function refreshDownloadedFlags() {
  try {
    const data = await api(`/api/files/${encodeURIComponent(state.file)}`);
    for (const c of data.comics) {
      const mine = state.byId.get(c.id);
      if (mine) mine.downloaded = c.downloaded;
    }
    applyFilter();
  } catch { /* 忽略，下次打开文件时会刷新 */ }
}

let pollTimer = null;
async function pollJob() {
  clearTimeout(pollTimer);
  try {
    setJob(await api('/api/download'));
  } catch { /* 服务暂时不可用时继续轮询 */ }
  if (state.job && state.job.running) pollTimer = setTimeout(pollJob, 1500);
}

/* ---------- 开关 ---------- */

$('#filter').addEventListener('input', applyFilter);
$('#chapter').addEventListener('input', applyFilter);

$('#hideDl').addEventListener('click', (e) => {
  state.hideDownloaded = !state.hideDownloaded;
  e.currentTarget.setAttribute('aria-pressed', String(state.hideDownloaded));
  storageSet('wn.hideDl', state.hideDownloaded ? '1' : '0');
  applyFilter();
});

$('#coverToggle').addEventListener('click', (e) => {
  state.showCover = !state.showCover;
  e.currentTarget.setAttribute('aria-pressed', String(state.showCover));
  storageSet('wn.cover', state.showCover ? '1' : '0');
  renderList();
});

/* ---------- 启动 ---------- */

(async function init() {
  state.showCover = storageGet('wn.cover') !== '0';
  state.hideDownloaded = storageGet('wn.hideDl') === '1';
  $('#coverToggle').setAttribute('aria-pressed', String(state.showCover));
  $('#hideDl').setAttribute('aria-pressed', String(state.hideDownloaded));

  try {
    await loadFiles();
  } catch (err) {
    toast(err.message);
    return;
  }
  const last = storageGet('wn.file');
  const initial = state.files.find((f) => f.name === last) || state.files[0];
  if (initial) await openFile(initial.name);
  pollJob();
})();
</script>
</body>
</html>
